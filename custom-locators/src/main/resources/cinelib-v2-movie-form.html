<body>
  <app-root ng-version="19.2.25"><app-header><header x-test-header="" class="app-header"><a routerlink="/" x-test-brand="" class="brand" ng-reflect-router-link="/" href="/"><span class="brand-mark">C</span><span class="brand-name">CineLib</span></a><nav class="app-nav"><a routerlink="/" routerlinkactive="active" x-test-nav-catalog="" class="nav-link" ng-reflect-router-link="/" ng-reflect-router-link-active="active" ng-reflect-router-link-active-options="[object Object]" href="/">Catalog</a><a routerlink="/stats" routerlinkactive="active" x-test-nav-stats="" class="nav-link" ng-reflect-router-link="/stats" ng-reflect-router-link-active="active" href="/stats">Statistics</a><a routerlink="/movie/new" routerlinkactive="active" x-test-nav-add="" class="nav-link active" ng-reflect-router-link="/movie/new" ng-reflect-router-link-active="active" href="/movie/new">Add movie</a></nav></header></app-header><main class="page"><router-outlet></router-outlet><app-movie-form><section x-test-form-page="" class="form-page"><h1 x-test-form-heading="" class="form-heading">Add movie</h1><form novalidate="" x-test-form="" class="movie-form ng-untouched ng-pristine ng-invalid" ng-reflect-form="[object Object]"><div class="field"><label for="title" class="field-label">Title</label><input id="title" type="text" formcontrolname="title" x-test-field-title="" class="field-input ng-untouched ng-pristine ng-invalid" ng-reflect-name="title"><!--container--></div><app-panel heading="Classification" note="year, genre and rating" ng-reflect-heading="Classification" ng-reflect-note="year, genre and rating"><section class="panel"><header class="panel-head"><h3 class="panel-heading">Classification</h3><span class="panel-note">year, genre and rating</span></header><div class="panel-body"><div class="field-row"><div class="field"><label for="year" class="field-label">Year</label><input id="year" type="number" formcontrolname="year" x-test-field-year="" class="field-input ng-untouched ng-pristine ng-valid" ng-reflect-name="year"><!--container--></div><div class="field"><label for="genre" class="field-label">Genre</label><select id="genre" formcontrolname="genre" x-test-field-genre="" class="field-input ng-untouched ng-pristine ng-valid" ng-reflect-name="genre"><option value="Adventure" ng-reflect-value="Adventure">Adventure</option><option value="Sci-Fi" ng-reflect-value="Sci-Fi">Sci-Fi</option><option value="Drama" ng-reflect-value="Drama">Drama</option><option value="Action" ng-reflect-value="Action">Action</option><option value="Romance" ng-reflect-value="Romance">Romance</option><option value="Thriller" ng-reflect-value="Thriller">Thriller</option><!--container--></select></div><div class="field"><label for="rating" class="field-label">Rating</label><input id="rating" type="number" step="0.1" formcontrolname="rating" x-test-field-rating="" class="field-input ng-untouched ng-pristine ng-valid" ng-reflect-name="rating"><!--container--></div></div></div></section></app-panel><div class="field"><label for="runtime" class="field-label">Runtime (minutes)</label><input id="runtime" type="number" formcontrolname="runtime" x-test-field-runtime="" class="field-input ng-untouched ng-pristine ng-valid" ng-reflect-name="runtime"><!--container--></div><div class="field"><label for="director" class="field-label">Director</label><input id="director" type="text" formcontrolname="director" x-test-field-director="" class="field-input ng-untouched ng-pristine ng-invalid" ng-reflect-name="director"><!--container--></div><div class="field"><label for="synopsis" class="field-label">Synopsis</label><textarea id="synopsis" formcontrolname="synopsis" rows="4" x-test-field-synopsis="" class="field-input ng-untouched ng-pristine ng-valid" ng-reflect-name="synopsis"></textarea></div><div class="field"><div class="cast-header"><span class="field-label">Cast</span><button type="button" x-test-cast-add="" class="btn btn-small">+ Add member</button></div><div formarrayname="cast" x-test-cast-editor="" class="cast-editor ng-untouched ng-pristine ng-valid" ng-reflect-name="cast"><!--container--><p class="cast-empty">No cast members yet.</p><!--container--></div></div><div class="form-actions"><button type="submit" x-test-form-submit="" class="btn btn-primary">Create movie</button><button type="button" x-test-form-cancel="" class="btn">Cancel</button></div></form></section></app-movie-form><!--container--></main><app-toast><!--container--></app-toast></app-root>
