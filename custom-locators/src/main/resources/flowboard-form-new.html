<!DOCTYPE html><html lang="en"><head>
  <script type="module" src="/@vite/client"></script>

  <meta charset="utf-8">
  <title>FlowBoard</title>

  <link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="styles.css"><script type="text/javascript">(() => {
  window.__abs = (sel) => {
    const el = document.querySelector(sel);
    if (!el) return null;
    let e = el, parts = [];
    while (e && e.nodeType === 1) {
      let i = 1, s = e.previousElementSibling;
      while (s) { if (s.tagName === e.tagName) i++; s = s.previousElementSibling; }
      parts.unshift(e.tagName.toLowerCase() + '[' + i + ']');
      e = e.parentElement;
    }
    return '/' + parts.join('/');
  };
})()</script></head>

r="Card title" x-test-form-title="" class="input form-title ng-untouched ng-pristine ng-invalid" ng-reflect-required="" ng-reflect-name="title" ng-reflect-model=""></div><div x-test-form-field-description="" class="form-field"><label for="field-description" x-test-form-description-label="" class="field-label">Description</label><textarea id="field-description" name="description" rows="4" placeholder="What is this card about?" x-test-form-description="" class="input form-description ng-untouched ng-pristine ng-valid" ng-reflect-name="description" ng-reflect-model=""></textarea></div><div class="form-row"><div x-test-form-field-priority="" class="form-field"><label for="field-priority" x-test-form-priority-label="" class="field-label">Priority</label><select id="field-priority" name="priority" x-test-form-priority="" class="input select form-priority ng-untouched ng-pristine ng-valid" ng-reflect-name="priority" ng-reflect-model="medium"><option value="low" ng-reflect-value="low">Low</option><option value="medium" ng-reflect-value="medium">Medium</option><option value="high" ng-reflect-value="high">High</option></select></div><div x-test-form-field-assignee="" class="form-field"><label for="field-assignee" x-test-form-assignee-label="" class="field-label">Assignee</label><input id="field-assignee" name="assignee" type="text" placeholder="Who works on it" x-test-form-assignee="" class="input form-assignee ng-untouched ng-pristine ng-valid" ng-reflect-name="assignee" ng-reflect-model=""></div><div x-test-form-field-column="" class="form-field"><label for="field-column" x-test-form-column-label="" class="field-label">Column</label><select id="field-column" name="columnId" x-test-form-column="" class="input select form-column ng-untouched ng-pristine ng-valid" ng-reflect-name="columnId" ng-reflect-model="backlog"><option value="backlog" ng-reflect-value="backlog">Backlog</option><option value="inprogress" ng-reflect-value="inprogress">In Progress</option><option value="review" ng-reflect-value="review">Review</option><option value="done" ng-reflect-value="done">Done</option></select></div></div><div x-test-form-field-tags="" class="form-field"><label for="field-tags" x-test-form-tags-label="" class="field-label">Tags (comma separated)</label><input id="field-tags" name="tags" type="text" placeholder="e.g. bug, ui" x-test-form-tags="" class="input form-tags ng-untouched ng-pristine ng-valid" ng-reflect-name="tags" ng-reflect-model=""></div><div x-test-form-actions="" class="form-actions"><button type="submit" x-test-form-submit="" class="btn btn-primary submit-btn">Save card</button><a routerlink="/" x-test-form-cancel="" class="btn btn-ghost cancel-btn" ng-reflect-router-link="/" href="/">Cancel</a></div></form></section></app-card-form><!--container--></main><app-toast><aside role="status" aria-live="polite" x-test-toast-bar="" class="toast-bar"><span aria-hidden="true" x-test-toast-icon="" class="toast-icon">ℹ</span><span x-test-toast-label="" class="toast-label">Last action:</span><span x-test-toast="" class="toast-message">Board loaded from seed</span></aside></app-toast><footer role="contentinfo" x-test-footer="" class="app-footer"><div class="footer-inner"><span x-test-footer-brand="" class="footer-brand">FlowBoard</span><span class="footer-sep">·</span><span x-test-footer-note="" class="footer-note">Deterministic demo board — data resets from a fixed seed</span><span class="footer-sep">·</span><span x-test-footer-version="" class="footer-version">v1.0</span></div></footer></div></app-root>
