<!DOCTYPE html><html lang="en"><head>
  <script type="module" src="/@vite/client"></script>

  <meta charset="utf-8">
  <title>CookBook</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="styles.css"></head>
<body>
  <app-root ng-version="19.2.25"><div class="app-shell"><app-header><header class="app-header"><div class="header-inner"><div class="brand-block"><a routerlink="/" class="brand-link" ng-reflect-router-link="/" href="/"><span aria-hidden="true" class="brand-mark">◆</span><span x-test-brand-name="" class="brand-name">CookBook</span></a><span class="brand-tagline">Recipe demo</span></div><nav aria-label="Main navigation" class="main-nav"><ul class="nav-list"><li class="nav-item"><a routerlink="/" routerlinkactive="active" class="nav-link" ng-reflect-router-link="/" ng-reflect-router-link-active="active" ng-reflect-router-link-active-options="[object Object]" href="/">Recipes</a></li><li class="nav-item"><a routerlink="/shopping" routerlinkactive="active" x-test-nav-shopping="" class="nav-link active" ng-reflect-router-link="/shopping" ng-reflect-router-link-active="active" href="/shopping">Shopping</a><span data-kind="shopping" class="nav-badge">2</span></li><li class="nav-item"><a routerlink="/stats" routerlinkactive="active" x-test-nav-stats="" class="nav-link" ng-reflect-router-link="/stats" ng-reflect-router-link-active="active" href="/stats">Stats</a><span class="nav-hint">numbers</span></li></ul></nav></div></header></app-header><main role="main" class="app-main"><router-outlet></router-outlet><app-shopping-list><section class="shopping-page"><div class="page-head"><div class="title-block"><h1 x-test-shopping-title="" class="page-title">Shopping list</h1><p class="page-sub">Ingredients added from the recipes</p></div></div><div class="shopping-summary"><p class="summary-line"><span data-kind="open" x-test-open-count="" class="summary-value">2</span><span class="summary-label">to buy</span></p><p class="summary-line"><span data-kind="done" x-test-done-count="" class="summary-value">1</span><span class="summary-label">bought</span></p></div><div class="shopping-body"><!--container--><div class="shop-group" data-recipe-id="2"><h2 class="group-title"><span class="group-name">Mushroom Risotto</span><span class="group-count">3</span></h2><ul class="shop-items"><li class="shop-item" data-item-id="1"><label class="shop-check"><input type="checkbox" class="shop-box" aria-label="Bought Arborio rice" x-test-shop-check="1"><span class="shop-text">320 g Arborio rice</span></label></li><li class="shop-item is-done" data-item-id="2"><label class="shop-check"><input type="checkbox" class="shop-box" aria-label="Bought Mushrooms" x-test-shop-check="2"><span class="shop-text">400 g Mushrooms</span></label></li><li class="shop-item" data-item-id="3"><label class="shop-check"><input type="checkbox" class="shop-box" aria-label="Bought Vegetable stock" x-test-shop-check="3"><span class="shop-text">1 l Vegetable stock</span></label></li><!--container--></ul></div><!--container--></div><div class="shopping-actions"><div class="action-group"><button type="button" x-test-clear-done="" class="btn">Clear bought items</button><span class="action-note">removes the checked lines</span></div></div></section></app-shopping-list><!--container--></main><footer role="contentinfo" class="app-footer"><div class="footer-inner"><p class="footer-line"><span x-test-footer-brand="" class="footer-brand">CookBook</span><span class="footer-sep">·</span><span class="footer-note">Fixed demo recipes, kept in memory only</span></p><p class="footer-line footer-meta"><span class="footer-label">Version</span><span x-test-footer-version="" class="footer-version">v1.0</span></p></div></footer><app-toast><div role="status" aria-live="polite" class="toast-bar"><div class="toast-box"><span aria-hidden="true" class="toast-icon">i</span><p x-test-toast-message="" class="toast-message">Recipes loaded from seed</p><button type="button" aria-label="Dismiss message" class="toast-close">×</button></div></div><!--container--></app-toast></div></app-root>
<script src="polyfills.js" type="module"></script><script src="main.js" type="module"></script>

</body></html>
